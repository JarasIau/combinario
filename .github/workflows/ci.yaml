name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint-python:
    name: lint python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install poetry
        run: pipx install poetry

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"

      - name: install dependencies
        run: poetry install --with dev,test --no-interaction

      - name: run ruff check
        run: poetry run ruff check .

      - name: run ruff format check
        run: poetry run ruff format --check .

      - name: run mypy
        run: poetry run mypy combinario tests
    
  lint-js:
    name: lint js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: install prettier
        run: npm install -g prettier
      - name: run prettier check
        run: prettier --check "combinario/**/*.{js,html,css}"

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [lint-python, lint-js]
    steps:
      - uses: actions/checkout@v4

      - name: create .env file
        run: cp .env.test .env

      - name: install poetry
        run: pipx install poetry

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"
      
      - name: install dependencies
        run: poetry install --with test --no-interaction

      - name: run tests
        run: poetry run pytest
