<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>combinario</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/style.css') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="{{ url_for('static', path='icons/512.png') }}"
    />
  </head>
  <body>
    <div class="topbar">
      <img
        src="{{ url_for('static', path='icons/512.png') }}"
        class="logo"
        alt="🌍"
      />
      <span class="title" title="combinario">combinario</span>
      <div class="topbar-actions">
        <button
          type="button"
          class="icon-button"
          data-action="toggle-sidebar-edit"
          aria-label="Edit sidebar"
          title="Edit sidebar"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
        </button>
        <button
          type="button"
          class="icon-button"
          data-action="clear-workspace"
          aria-label="Clear workspace"
          title="Clear workspace"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M8 6V4h8v2" />
            <path d="m6 6 1 14h10l1-14" />
            <path d="M10 11v5" />
            <path d="M14 11v5" />
          </svg>
        </button>
      </div>
    </div>
    <div class="sidenav">
      <div class="items-container">
        <div
          class="item"
          draggable="true"
          data-base-item="true"
          item-text="Water"
          item-emoji="💧"
          item-id="1"
        >
          <span class="item-emoji">💧</span>
          Water
        </div>
        <div
          class="item"
          draggable="true"
          data-base-item="true"
          item-text="Fire"
          item-emoji="🔥"
          item-id="2"
        >
          <span class="item-emoji">🔥</span>
          Fire
        </div>
        <div
          class="item"
          draggable="true"
          data-base-item="true"
          item-text="Earth"
          item-emoji="🌍"
          item-id="3"
        >
          <span class="item-emoji">🌍</span>
          Earth
        </div>
        <div
          class="item"
          draggable="true"
          data-base-item="true"
          item-text="Wind"
          item-emoji="🌬️"
          item-id="4"
        >
          <span class="item-emoji">🌬️</span>
          Wind
        </div>
      </div>
      <div class="searchbar">
        <input type="text" placeholder="Search items..." />
      </div>
    </div>
    <div class="workspace">
      <canvas id="stars-canvas"></canvas>
    </div>
    <script src="{{ url_for('static', path='js/items.js') }}"></script>
    <script src="{{ url_for('static', path='js/saver.js') }}"></script>
    <script src="{{ url_for('static', path='js/stars.js') }}"></script>
  </body>
</html>
